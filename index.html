<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trovina.io | US Software, AI & Cloud Development Agency</title>
  <meta name="description" content="Trovina is a US-based software, AI, and cloud product studio. We design, build, and scale custom web apps, mobile apps, and AI automation for startups and enterprises." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- No-flash theme: apply stored/system theme before paint (mirrors ThemeProvider). -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('trovina-theme');
        var dark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        root.style.backgroundColor = dark ? '#0a0a0c' : '#ffffff';
      } catch (e) { }
    })();
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Organization", "ProfessionalService"],
      "name": "Trovina Technologies LLC",
      "alternateName": "Trovina.io",
      "url": "https://trovina.io",
      "logo": "https://trovina.io/logo.png",
      "email": "hello@trovina.io",
      "telephone": "+1 (212) 555-0188",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "447 Broadway, 2nd Floor",
        "addressLocality": "New York",
        "addressRegion": "NY",
        "postalCode": "10013",
        "addressCountry": "US"
      },
      "areaServed": { "@type": "Country", "name": "United States" },
      "sameAs": [
        "https://linkedin.com/company/trovinaio",
        "https://facebook.com/trovinaio",
        "https://youtube.com/@trovinaio"
      ]
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
